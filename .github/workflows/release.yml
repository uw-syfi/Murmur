name: Release

# Publishing a GitHub release tagged vX.Y.Z builds the sdist + wheel,
# uploads them to PyPI (via trusted publishing, no API token), and attaches
# them to the release.
on:
  release:
    types: [published]
  workflow_dispatch: # build-only dry run (does not publish)

jobs:
  build:
    uses: ./.github/workflows/package.yml

  hardware:
    if: github.event_name == 'release' && (vars.MURMUR_MLX_CI == 'true' || vars.MURMUR_CUDA_CI == 'true')
    uses: ./.github/workflows/hardware.yml
    with:
      suite: full

  publish-pypi:
    needs: [build, hardware]
    if: >-
      !cancelled() && github.event_name == 'release' && needs.build.result == 'success' &&
      (needs.hardware.result == 'success' || needs.hardware.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/murmur-asr/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach-to-release:
    needs: [build, hardware]
    if: >-
      !cancelled() && github.event_name == 'release' && needs.build.result == 'success' &&
      (needs.hardware.result == 'success' || needs.hardware.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload dist to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
