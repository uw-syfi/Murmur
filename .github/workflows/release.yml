name: Release

# Publishing a GitHub release tagged vX.Y.Z builds the sdist + wheel,
# uploads them to PyPI (via trusted publishing, no API token), and attaches
# them to the release.
on:
  release:
    types: [published]
  workflow_dispatch: # build-only dry run (does not publish)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          pkg_version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('murmur/__init__.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match murmur.__version__ ($pkg_version)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/murmur-asr/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach-to-release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload dist to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
