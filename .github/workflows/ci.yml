name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: CPU tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - name: Install client and test dependencies
        run: |
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[test]' meeteval
      - run: python -m pytest -q --ignore=tests/test_mlx_checkpoints.py

  package:
    uses: ./.github/workflows/package.yml
