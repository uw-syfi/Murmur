[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "murmur-asr"
# Single source of truth: murmur/__init__.py. The release workflow checks the
# GitHub release tag (vX.Y.Z) matches it.
dynamic = ["version"]
description = "Efficient long-context ASR inference with hierarchical chunking (target chunks + draft windows on vLLM)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "uw-syfi" }]
keywords = ["asr", "speech-recognition", "vllm", "speculative-decoding", "diarization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Client side (the vLLM server runs in its own environment; see README).
dependencies = [
    "numpy",
    "requests",
    "scipy",
    "soundfile",
    "torch",
    "torchaudio",
]

[project.optional-dependencies]
# Diarization for chunk boundaries and cross-chunk speaker linking.
diarize = ["pyannote.audio>=4.0"]
# Draft windows (short-window ASR drafts).
drafts = ["faster-whisper>=1.0", "opencc"]
# Scoring (benchmarks).
eval = ["jiwer", "meeteval", "pyannote.metrics"]
all = ["murmur-asr[diarize,drafts,eval]"]
# Server side: only what the drafter plugin needs inside the vLLM process.
server = ["transformers"]
test = ["pytest", "jiwer"]

[project.urls]
Homepage = "https://github.com/uw-syfi/Murmur"
Repository = "https://github.com/uw-syfi/Murmur"
Issues = "https://github.com/uw-syfi/Murmur/issues"
Paper = "https://arxiv.org/abs/2606.01483"

[project.scripts]
murmur = "murmur.cli:main"

[tool.setuptools.dynamic]
version = { attr = "murmur.__version__" }

[tool.setuptools.packages.find]
include = ["murmur*"]

[tool.setuptools.package-data]
"murmur.drafting" = ["_vllm_site/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
